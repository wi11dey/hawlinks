<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>hawlinks</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700" rel="stylesheet">
        <style>
         html, body {
             height: 100%;
             font-family: "Pixelify Sans", sans-serif;
             font-optical-sizing: auto;
             font-style: normal;
             margin: 0;
         }

         body {
             display: flex;
             flex-direction: column;
             height: 100dvh;
         }

         button, input, select, textarea {
             font: inherit;
         }

         nav {
             flex-shrink: 0;
             display: flex;
             align-items: end;
             gap: 4px;
             border-bottom: 2px solid black;
             box-sizing: border-box;

             padding-top: 10px;
         }

         nav button {
             position: relative;
             padding: 8px 16px;
             background: #eddae2;
             border: 2px solid black;
             border-bottom: 0;
             cursor: pointer;

             margin-bottom: -2px;
             margin-left: 10px;
         }

         nav button[aria-selected="true"], nav button:hover { background: white; }

         section {
             position: relative;
             flex: 1;
             min-height: 0;
             overflow: hidden;
         }

         section > marquee {
             position: absolute;
             inset: 0;
             width: 100%;
             height: 100%;
             pointer-events: none;
         }

         marquee a {
             display: inline-block;
             pointer-events: auto;
         }

         marquee img { display: block; }
        </style>
        <script>
         function logIn(personalAccessToken) {
             localStorage.setItem('hawlinks-personal-access-token', personalAccessToken);
         }

         function switchTab(button) {
             for (const tab of document.getElementsByTagName('nav')[0].getElementsByTagName('button')) {
                 tab.setAttribute('aria-selected', tab === button);
             }
             for (const section of document.getElementsByTagName('section')) {
                 section.hidden = section.id !== button.textContent;
             }
         }

         function promptForLink(event) {
             const image = (event.dataTransfer || event.clipboardData).files[0];
             if (!image || !image.type.startsWith('image/')) {
                 return;
             }

             event.preventDefault();
             const dialog = document.getElementsByTagName('dialog')[0];
             dialog.image = image;
             dialog.showModal();
         }

         function addImageAndLink(image, link) {
             const reader = new FileReader();
             reader.onload = () => {
                 const vertical = document.createElement('marquee');
                 vertical.direction = Math.random() < 0.5 ? 'up' : 'down';
                 vertical.behavior = 'alternate';
                 vertical.scrollAmount = 1 + Math.floor(Math.random() * 6);

                 const horizontal = document.createElement('marquee');
                 horizontal.direction = Math.random() < 0.5 ? 'left' : 'right';
                 horizontal.behavior = 'alternate';
                 horizontal.scrollAmount = 1 + Math.floor(Math.random() * 6);

                 const anchor = document.createElement('a');
                 anchor.href = link;
                 anchor.target = '_blank';

                 const img = document.createElement('img');
                 img.src = reader.result;
                 img.width = 200;

                 anchor.append(img);
                 horizontal.append(anchor);
                 vertical.append(horizontal);
                 document.querySelector('section:not([hidden])').append(vertical);
             };
             reader.readAsDataURL(image);
         }
        </script>
    </head>
    <body ondragover="event.preventDefault()" ondrop="promptForLink(event)" onpaste="promptForLink(event)">
        <nav>
            <button aria-selected="true" onclick="switchTab(this)">patterns</button>
            <button onclick="switchTab(this)">nails</button>
        </nav>

        <dialog>
            <form method="dialog" onsubmit="addImageAndLink(this.closest('dialog').image, this.elements.link.value)">
                <label>
                    Link? <input name="link" autofocus>
                </label>
                <button>Add</button>
            </form>
        </dialog>

        <section id="patterns">
            <marquee direction="down" behavior="alternate" scrollamount="3">
                <marquee direction="right" behavior="alternate" scrollamount="5">
                    <a href="https://www.mamainastitch.com/beatrice-chicken-crochet-pattern/" target="_blank">
                        <img src="Chunky-Chicken-Crochet-Pattern-1-scaled.jpg" width="200"/>
                    </a>
                </marquee>
            </marquee>

            <marquee direction="up" behavior="alternate" scrollamount="5">
                <marquee direction="left" behavior="alternate" scrollamount="3">
                    <a href="https://www.mariskavos.nl/free-puffin-crochet-pattern/" target="_blank">
                        <img src="images.jpeg" width="200">
                    </a>
                </marquee>
            </marquee>
            <!-- haii hawlie add more stuff you want in here just like the a above -->
        </section>
        <section id="nails" hidden></section>
    </body>
</html>
