<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>hawlinks</title>
        <style>
         html, body {
             height: 100%;
         }

         body > marquee {
             position: absolute;
             inset: 0;
             width: 100%;
             height: 100%;
             pointer-events: none;
         }

         marquee a, marquee img { pointer-events: auto; }

         img { display: block; }

        </style>
        <script>
         document.ondragover = event => event.preventDefault();
         document.ondrop = document.onpaste = event => {
             const files = [...(event.dataTransfer || event.clipboardData).files].filter(file => file.type.startsWith('image/'));
             if (!files.length) return;
             event.preventDefault();
             for (const file of files) {
                 const href = prompt('Link?', 'https://');
                 if (!href) continue;
                 const reader = new FileReader();
                 reader.onload = () => {
                     const picture = { src: reader.result, href };
                     try { localStorage.setItem('hawlinks-pictures-v1', JSON.stringify(pictures)); }
                     catch { alert('Browser storage is full or unavailable; this picture will disappear on reload.'); }
                 };
                 reader.readAsDataURL(file);
             }
         };
        </script>
    </head>
    <body>
        <marquee direction="down" behavior="alternate" scrollamount="3">
            <marquee direction="right" behavior="alternate" scrollamount="5">
                <a href="https://www.mamainastitch.com/beatrice-chicken-crochet-pattern/" target="_blank">
                    <img src="Chunky-Chicken-Crochet-Pattern-1-scaled.jpg" width="200"/>
                </a>
            </marquee>
        </marquee>

        <marquee direction="up" behavior="alternate" scrollamount="5">
            <marquee direction="left" behavior="alternate" scrollamount="3">
                <a href="https://www.mariskavos.nl/free-puffin-crochet-pattern/" target="_blank">
                    <img src="images.jpeg" width="200">
                </a>
            </marquee>
        </marquee>

        <!-- haii hawlie add more stuff you want in here just like the a above -->
    </body>
</html>
